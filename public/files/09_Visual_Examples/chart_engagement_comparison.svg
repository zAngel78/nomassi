<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Social Media Engagement Rate Comparison
  </text>
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">
    YU vs Peer Institutions (2025)
  </text>
  
  <!-- Grid lines -->
  <line x1="100" y1="100" x2="100" y2="400" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="100" y1="400" x2="700" y2="400" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="85" y="105" font-family="Arial" font-size="12" text-anchor="end" fill="#64748b">5%</text>
  <text x="85" y="175" font-family="Arial" font-size="12" text-anchor="end" fill="#64748b">4%</text>
  <text x="85" y="245" font-family="Arial" font-size="12" text-anchor="end" fill="#64748b">3%</text>
  <text x="85" y="315" font-family="Arial" font-size="12" text-anchor="end" fill="#64748b">2%</text>
  <text x="85" y="385" font-family="Arial" font-size="12" text-anchor="end" fill="#64748b">1%</text>
  <text x="85" y="405" font-family="Arial" font-size="12" text-anchor="end" fill="#64748b">0%</text>
  
  <!-- Horizontal grid lines -->
  <line x1="100" y1="100" x2="700" y2="100" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="170" x2="700" y2="170" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="240" x2="700" y2="240" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="100" y1="310" x2="700" y2="310" stroke="#f1f5f9" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- TikTok -->
  <rect x="130" y="112" width="60" height="288" fill="#3b82f6" rx="4"/>
  <text x="160" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">TikTok</text>
  <text x="160" y="100" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#3b82f6">4.80%</text>
  
  <!-- Instagram -->
  <rect x="220" y="190" width="60" height="210" fill="#8b5cf6" rx="4"/>
  <text x="250" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">Instagram</text>
  <text x="250" y="178" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b5cf6">2.99%</text>
  
  <!-- Facebook -->
  <rect x="310" y="192" width="60" height="208" fill="#06b6d4" rx="4"/>
  <text x="340" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">Facebook</text>
  <text x="340" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#06b6d4">2.97%</text>
  
  <!-- Twitter/X -->
  <rect x="400" y="330" width="60" height="70" fill="#64748b" rx="4"/>
  <text x="430" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">Twitter/X</text>
  <text x="430" y="318" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#64748b">1.00%</text>
  
  <!-- LinkedIn -->
  <rect x="490" y="316" width="60" height="84" fill="#0ea5e9" rx="4"/>
  <text x="520" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">LinkedIn</text>
  <text x="520" y="304" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0ea5e9">1.20%</text>
  
  <!-- YU Current -->
  <rect x="600" y="320" width="60" height="80" fill="#ef4444" rx="4"/>
  <text x="630" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">YU Avg</text>
  <text x="630" y="308" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ef4444">1.14%</text>
  
  <!-- Legend -->
  <rect x="100" y="460" width="15" height="15" fill="#3b82f6" rx="2"/>
  <text x="120" y="471" font-family="Arial" font-size="11" fill="#64748b">Industry Benchmark</text>
  
  <rect x="250" y="460" width="15" height="15" fill="#ef4444" rx="2"/>
  <text x="270" y="471" font-family="Arial" font-size="11" fill="#64748b">YU Current Performance</text>
</svg>
