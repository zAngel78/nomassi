<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Content Category Distribution
  </text>
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">
    YU Social Media Content Analysis (2025)
  </text>
  
  <!-- Pie Chart Center -->
  <g transform="translate(250, 300)">
    <!-- Academic Excellence - 30% (108 degrees) -->
    <path d="M 0,-150 A 150,150 0 0,1 129.9,-75 L 0,0 Z" fill="#3b82f6"/>
    
    <!-- Student Life - 25% (90 degrees) -->
    <path d="M 129.9,-75 A 150,150 0 0,1 150,0 L 0,0 Z" fill="#8b5cf6"/>
    
    <!-- Events - 20% (72 degrees) -->
    <path d="M 150,0 A 150,150 0 0,1 97.5,112.5 L 0,0 Z" fill="#06b6d4"/>
    
    <!-- Athletics - 15% (54 degrees) -->
    <path d="M 97.5,112.5 A 150,150 0 0,1 -48.5,141.9 L 0,0 Z" fill="#10b981"/>
    
    <!-- Alumni - 10% (36 degrees) -->
    <path d="M -48.5,141.9 A 150,150 0 0,1 0,-150 L 0,0 Z" fill="#f59e0b"/>
    
    <!-- Center circle for donut effect -->
    <circle cx="0" cy="0" r="70" fill="#ffffff"/>
    <text x="0" y="-10" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">100%</text>
    <text x="0" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">Total Content</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(480, 180)">
    <!-- Academic Excellence -->
    <rect x="0" y="0" width="20" height="20" fill="#3b82f6" rx="3"/>
    <text x="30" y="15" font-family="Arial" font-size="14" fill="#1e293b">Academic Excellence</text>
    <text x="250" y="15" font-family="Arial" font-size="16" font-weight="bold" fill="#3b82f6">30%</text>
    <text x="30" y="32" font-family="Arial" font-size="11" fill="#64748b">Research, faculty achievements, programs</text>
    
    <!-- Student Life -->
    <rect x="0" y="50" width="20" height="20" fill="#8b5cf6" rx="3"/>
    <text x="30" y="65" font-family="Arial" font-size="14" fill="#1e293b">Student Life</text>
    <text x="250" y="65" font-family="Arial" font-size="16" font-weight="bold" fill="#8b5cf6">25%</text>
    <text x="30" y="82" font-family="Arial" font-size="11" fill="#64748b">Campus activities, student stories</text>
    
    <!-- Events -->
    <rect x="0" y="100" width="20" height="20" fill="#06b6d4" rx="3"/>
    <text x="30" y="115" font-family="Arial" font-size="14" fill="#1e293b">Events & News</text>
    <text x="250" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#06b6d4">20%</text>
    <text x="30" y="132" font-family="Arial" font-size="11" fill="#64748b">Announcements, ceremonies, speakers</text>
    
    <!-- Athletics -->
    <rect x="0" y="150" width="20" height="20" fill="#10b981" rx="3"/>
    <text x="30" y="165" font-family="Arial" font-size="14" fill="#1e293b">Athletics</text>
    <text x="250" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#10b981">15%</text>
    <text x="30" y="182" font-family="Arial" font-size="11" fill="#64748b">Sports achievements, team highlights</text>
    
    <!-- Alumni -->
    <rect x="0" y="200" width="20" height="20" fill="#f59e0b" rx="3"/>
    <text x="30" y="215" font-family="Arial" font-size="14" fill="#1e293b">Alumni Success</text>
    <text x="250" y="215" font-family="Arial" font-size="16" font-weight="bold" fill="#f59e0b">10%</text>
    <text x="30" y="232" font-family="Arial" font-size="11" fill="#64748b">Graduate achievements, testimonials</text>
  </g>
  
  <!-- Key Insight Box -->
  <rect x="50" y="500" width="700" height="80" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="400" y="530" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Key Insight: Academic Excellence content performs 2.8x better with informal tone
  </text>
  <text x="400" y="555" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">
    Recommendation: Maintain academic focus while incorporating more student-voice storytelling
  </text>
</svg>
